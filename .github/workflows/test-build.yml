# 2026-09-08 临时暂停非必需安装包：当前只需要 Win10/Win11 x64 EXE 和 Win7 x64 EXE。
# MSI、macOS DMG、便携 ZIP 的配置保留在注释中，后续仅在用户明确要求时恢复。
# 恢复 MSI：取消 WiX 安装和 MSI 上传项的注释，移除 Windows 构建命令的 --exe-only；
# release.yml 中还需恢复 MSI 必需资产项及 EXE 行末逗号。
# 恢复 macOS：取消 build-macos 整段注释，并恢复发布依赖/条件或测试平台选项。
# MSI 与 macOS 均恢复后，移除 release.yml 元数据命令的 --windows-exe-only。
# 部分恢复时需同步调整元数据资产名单；保留 latest.json、校验文件和桥接清单用于更新。

name: Test Build (测试打包)

on:
  schedule:
    # Monday 02:00 Asia/Shanghai. Scheduled runs exercise the Windows package.
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      platform:
        description: "选择打包平台 (Target Platform)"
        required: true
        default: "windows"
        type: choice
        options:
          - "windows"
          - "windows-win7"
          - "windows-all"
          # 暂停 macOS 选项；恢复 build-macos 后取消以下注释。
          # - "macos"
          # - "all"
      run_tests:
        description: "打包前是否运行单元测试 (Run unit tests before packaging)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare build metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      target_platform: ${{ steps.meta.outputs.target_platform }}
      run_tests: ${{ steps.meta.outputs.run_tests }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Extract metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'from hr_toolkit import __version__; print(__version__)')
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            TARGET_PLATFORM="windows-all"
            RUN_TESTS="true"
          else
            TARGET_PLATFORM="${{ inputs.platform }}"
            RUN_TESTS="${{ inputs.run_tests }}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "target_platform=${TARGET_PLATFORM}" >> "${GITHUB_OUTPUT}"
          echo "run_tests=${RUN_TESTS}" >> "${GITHUB_OUTPUT}"
          echo "Build version: ${VERSION} (commit: ${SHORT_SHA})"
          echo "Target: ${TARGET_PLATFORM}; tests: ${RUN_TESTS}"

  build-windows:
    name: Build Windows x64 EXE
    needs: prepare
    if: needs.prepare.outputs.target_platform == 'windows' || needs.prepare.outputs.target_platform == 'windows-all' || needs.prepare.outputs.target_platform == 'all'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-gui.txt
            constraints/python312-production.txt

      - name: Install Python build dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade -c constraints/python312-production.txt pip
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-build.txt -c constraints/python312-production.txt
          python -m pip check

      - name: Exercise local OCR models and inference
        run: >-
          python -c
          "from hr_toolkit.runtime_checks import ocr_runtime_smoke_test; ocr_runtime_smoke_test()"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # 暂停 MSI 专用依赖；恢复 MSI 时取消以下两行注释。
          # dotnet tool install --global wix --version 5.0.2
          # "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run unit tests (Optional)
        if: needs.prepare.outputs.run_tests == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Build Windows Application and Installers
        run: >-
          python scripts/release_windows.py
          --exe-only
          --version "${{ env.VERSION }}"
          --build-dir dist/windows
          --output-dir artifacts/windows

      # 暂停便携 ZIP：当前只需要 EXE，恢复时取消本步骤及对应上传路径的注释。
      # - name: Create Portable Zip (免安装绿色包)
      #   shell: pwsh
      #   run: |
      #     $zipPath = "artifacts/windows/HRToolkit_${env:VERSION}_test_${env:SHORT_SHA}_portable.zip"
      #     Compress-Archive -Path dist/windows/HRToolkit -DestinationPath $zipPath -Force
      #     Write-Host "Portable zip created at $zipPath"

      - name: Upload Windows test artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: HRToolkit-Windows-Test-${{ env.VERSION }}-${{ env.SHORT_SHA }}
          path: |
            artifacts/windows/HRToolkit_${{ env.VERSION }}_x64-setup.exe
          #   artifacts/windows/HRToolkit_${{ env.VERSION }}_x64.msi
          #   artifacts/windows/HRToolkit_${{ env.VERSION }}_test_${{ env.SHORT_SHA }}_portable.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build-windows-win7:
    name: Build Windows 7 SP1 compatibility x64 EXE
    needs: prepare
    if: needs.prepare.outputs.target_platform == 'windows-win7' || needs.prepare.outputs.target_platform == 'windows-all' || needs.prepare.outputs.target_platform == 'all'
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
      PYTHONUTF8: "1"
      HR_TOOLKIT_7ZIP_EXE: ${{ github.workspace }}\build\win7-runtime\7zip\7z.exe
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.8 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.8.10"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-win7.txt
            requirements-build.txt
            requirements-gui.txt
            constraints/python38-win7.txt

      - name: Install frozen Win7 build dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==25.0.1"
          python -m pip install --disable-pip-version-check -r requirements-win7.txt -r requirements-build.txt -c constraints/python38-win7.txt
          python -m pip check

      - name: Prepare pinned Win7 runtimes
        run: python scripts/prepare_win7_runtime.py --output-dir build/win7-runtime

      - name: Exercise local OCR and archive runtimes
        run: >-
          python -c
          "from hr_toolkit.runtime_checks import ocr_runtime_smoke_test, smoke_test; ocr_runtime_smoke_test(); smoke_test()"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          # 暂停 MSI 专用依赖；恢复 MSI 时取消以下两行注释。
          # dotnet tool install --global wix --version 5.0.2
          # "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run Python 3.8-compatible core tests (Optional)
        if: needs.prepare.outputs.run_tests == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m unittest -v
          tests.test_archive_import
          tests.test_data_statistics
          tests.test_project_store
          tests.test_runtime_checks
          tests.test_salary_merge
          tests.test_salary_split
          tests.test_social_security
          tests.test_tool_registry
          tests.test_paths
          tests.test_release_metadata
          tests.test_background_process
          tests.test_qt_controller
          tests.test_qt_entrypoint
          tests.test_qt_form_specs
          tests.test_run_coordinator

      - name: Build Win7 application and installers
        run: >-
          python scripts/release_windows.py
          --exe-only
          --version "${{ env.VERSION }}"
          --target win7
          --seven-zip-dir build/win7-runtime/7zip
          --ucrt-dir build/win7-runtime/ucrt
          --vc-runtime-dir build/win7-runtime/vc-runtime
          --build-dir dist/windows-win7
          --work-dir build/windows-win7
          --output-dir artifacts/windows-win7

      # 暂停便携 ZIP：当前只需要 EXE，恢复时取消本步骤及对应上传路径的注释。
      # - name: Create Win7 portable zip
      #   shell: pwsh
      #   run: |
      #     $zipPath = "artifacts/windows-win7/HRToolkit_${env:VERSION}_win7_test_${env:SHORT_SHA}_portable.zip"
      #     Compress-Archive -Path dist/windows-win7/HRToolkit -DestinationPath $zipPath -Force

      - name: Upload Win7 test artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: HRToolkit-Windows7-Test-${{ env.VERSION }}-${{ env.SHORT_SHA }}
          path: |
            artifacts/windows-win7/HRToolkit_${{ env.VERSION }}_win7_x64-setup.exe
          #   artifacts/windows-win7/HRToolkit_${{ env.VERSION }}_win7_x64.msi
          #   artifacts/windows-win7/HRToolkit_${{ env.VERSION }}_win7_test_${{ env.SHORT_SHA }}_portable.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

